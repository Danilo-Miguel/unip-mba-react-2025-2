<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 1 - React.js</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fragmentos em listas de definição -->
    <script type="text/babel">
        function TermoDefinicao({ termo, definicao }) {
            return (
                <>
                    <dt>{termo}</dt>
                    <dd>{definicao}</dd>
                </>
            );
        }

        function Glossario() {
            return (
                <dl>
                    <TermoDefinicao termo="React" definicao="Biblioteca JavaScript para UI" />
                    <TermoDefinicao termo="JSX" definicao="Extensão de sintaxe do JavaScript" />
                </dl>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Glossario />);
    </script>
</body>
</html>
