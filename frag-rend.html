<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 1 - React.js</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Renderização condicional com Fragmentos -->
    <script type="text/babel">
        function Perfil({ usuario }) {
            return (
                <div>
                    <h1>Perfil</h1>
                    {usuario.admin ? (
                        <>
                            <p>Painel de Administrador</p>
                            <button>Configurações Avançadas</button>
                            <button>Gerenciar Usuários</button>
                        </>
                    ) : (
                        <>
                            <p>Painel de Usuário</p>
                            <button>Editar Perfil</button>
                        </>
                    )}
                </div>
            );
        }

        const usuario = { nome: "Danilo", admin: false };
        ReactDOM.createRoot(document.getElementById('root')).render(<Perfil usuario={usuario} />);
    </script>
</body>
</html>
