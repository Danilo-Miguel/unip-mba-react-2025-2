<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 1 - React.js</title>
</head>
<body>
    <div id="root"></div>

    <script src ="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src ="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Importa styled-components diretamente via CDN -->
    <script src="https://unpkg.com/styled-components/dist/styled-components.min.js"></script>

    <script type="text/babel">
        // Cria um componente de estilo usando styled-components
        const Titulo = styled.h1`
            color: purple;
            background-color: lavender;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        `;

        // Renderiza o componente estilizado no DOM
        ReactDOM.createRoot(document.getElementById('root')).render(
            <Titulo>Olá, mundo estilizado com CSS-in-JS!</Titulo>
        );
    </script>
    
</body>
</html>
