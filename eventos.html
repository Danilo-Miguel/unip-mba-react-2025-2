<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventos React</title>
</head>
<body>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone/babel.min.js"></script>

  <script type="text/babel">

    const BotaoSemParametros = () => (
      <div>
        <button onClick={() => alert("Clique sem parâmetros")}>Click sem parâmetros (alert)</button>
        <button onClick={() => console.log("Outra ação sem parâmetros")}>Click sem parâmetros (console)</button>
      </div>
    );

    const BotaoComParametros = () => (
      <div>
        <button onClick={() => alert("Mensagem passada por parâmetro")}>Click com parâmetro (alert)</button>
        <button onClick={() => console.log("Soma:", 10 + 20)}>Click com parâmetros (soma)</button>
      </div>
    );

    const BotaoComEvent = () => (
      <div>
        <button onClick={(e) => console.log("Tipo do evento:", e.type)}>Click com event (type)</button>
        <button onClick={(e) => console.log("Elemento clicado:", e.target.tagName)}>Click com event (target)</button>
      </div>
    );

    function App() {
      return (
        <div style={{ padding: "16px" }}>
          <h2>Sem Parâmetros</h2>
          <BotaoSemParametros />

          <h2>Com Parâmetros</h2>
          <BotaoComParametros />

          <h2>Com Event</h2>
          <BotaoComEvent />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
</html>
